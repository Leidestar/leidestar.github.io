name: main

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: node index.mjs out
        env:
          K: ${{ secrets.K }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: d
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 20
      - if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - if: github.event_name != 'push'
        run: |
          l=$(git log -1 --format=%ct)
          n=$(date +%s)
          if [ $((n - l)) -gt 2160000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "."
            git push
          fi
      - if: always()
        run: |
          gh workflow enable main.yml --repo "$GITHUB_REPOSITORY" || true
          for i in $(gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq '.[1:][].id' 2>/dev/null); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$i/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$i" >/dev/null 2>&1 || true
          done
          a=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null) && w=$((270 - $(date +%s) + $(date -d "$a" +%s))) && [ "$w" -gt 0 ] && sleep "$w"
          for j in 1 2 3; do
            c=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml -L 20 --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length") || c=x
            [ "$c" = "x" ] || [ "$c" = "0" ] || break
            gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main && break
            sleep 10
          done
        env:
          GH_TOKEN: ${{ github.token }}
